<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mysterious Pictures Challenge</title>
<style>
*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f5f3f8;color:#241b2d}
button,select{font:inherit} .participant{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
.participant img{width:100vw;height:100vh;object-fit:contain}
header{background:#54227d;color:white;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:28px} .wrap{max-width:1200px;margin:auto;padding:22px}
.panel{background:white;border:2px solid #54227d;border-radius:20px;padding:18px;box-shadow:0 4px 14px #0001}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center}
select,button{border:2px solid #54227d;border-radius:10px;padding:11px 16px;background:white;color:#54227d;font-weight:700}
button.primary{background:#54227d;color:white} button:disabled{opacity:.35}
.status{text-align:center;margin:14px 0 4px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:20px}
.qcard{background:white;border:2px solid #54227d;border-radius:18px;min-height:300px;display:flex;align-items:center;justify-content:center;gap:26px;padding:18px}
.qcard img{width:min(220px,40vw);height:auto;image-rendering:pixelated} .letter{font-size:72px;font-weight:900;color:#54227d;min-width:90px;text-align:center}
.nav{display:flex;justify-content:center;gap:12px;margin:18px 0}
.reveal{display:none;margin-top:20px} .reveal.show{display:block}
.seq{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.seq div{background:white;border:1px solid #ddd;border-radius:12px;padding:8px;text-align:center;font-weight:bold}
.seq img{width:100%;border-radius:8px;display:block;margin-bottom:6px}
.note{text-align:center;color:#655b6c;font-size:14px;margin-top:10px}
.venue-tools{margin-top:16px;display:grid;grid-template-columns:minmax(240px,1fr) minmax(360px,1.35fr);gap:16px}
.toolbox{background:white;border:2px solid #54227d;border-radius:20px;padding:14px 18px;box-shadow:0 4px 14px #0001}
.music-row{display:flex;align-items:center;justify-content:center;gap:12px;min-height:96px}
.music-btn.playing{background:#54227d;color:white}
.timer-box{text-align:center}
.timer-display{font-size:clamp(72px,10vw,150px);line-height:.95;font-weight:900;letter-spacing:4px;color:#54227d;font-variant-numeric:tabular-nums;margin:4px 0 10px}
.timer-display.done{color:#b42318}
.timer-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.timer-controls input{width:88px;border:2px solid #54227d;border-radius:10px;padding:10px;text-align:center;font:inherit;font-weight:800;color:#54227d}
@media(max-width:820px){.venue-tools{grid-template-columns:1fr}.timer-display{font-size:clamp(64px,18vw,120px)}}
@media(max-width:700px){header{padding:12px 14px}h1{font-size:21px}.wrap{padding:10px}.grid{grid-template-columns:1fr}.qcard{min-height:240px}.letter{font-size:54px}}
@media(min-width:900px){.grid{height:calc(100vh - 265px)}.qcard{min-height:0}}
</style></head><body>
<div id="app"></div>
<script src="qrcode.js"></script>
<script>
const BASE_URL="https://AmrAlaa77.github.io/mysterious-pictures-challenge/";
const TOKEN_MAP={"eguMyo4w":1,"yurkXzNB":2,"Cd6s9JxE":3,"7QRo4c4S":4,"y8ntf8fC":5,"KLUDgJUw":6,"R6rxbU2X":7,"oiEozPnk":8,"GJMNKjH7":9,"uMuUHCi6":10,"ThvLsXor":11,"2ujLVvZT":12,"U28EqsWM":13,"h2qTigx2":14,"5MLSy2Zz":15,"ysT3aBKV":16,"6sRAUQ3w":17,"xpguBWkY":18,"yYUzwtJG":19,"2ZDtDrGh":20,"zBDgET8F":21,"jnao92j7":22,"7zEaKwH7":23,"9Z8D5PAk":24,"yTVXyEgT":25,"VBYh9r3t":26,"p5FE3RgL":27,"zg7aJLtm":28,"C3X6SKqs":29,"bLc2FVsx":30};
const POS_TO_TOKEN=["eguMyo4w","yurkXzNB","Cd6s9JxE","7QRo4c4S","y8ntf8fC","KLUDgJUw","R6rxbU2X","oiEozPnk","GJMNKjH7","uMuUHCi6","ThvLsXor","2ujLVvZT","U28EqsWM","h2qTigx2","5MLSy2Zz","ysT3aBKV","6sRAUQ3w","xpguBWkY","yYUzwtJG","2ZDtDrGh","zBDgET8F","jnao92j7","7zEaKwH7","9Z8D5PAk","yTVXyEgT","VBYh9r3t","p5FE3RgL","zg7aJLtm","C3X6SKqs","bLc2FVsx"];
function imgSrc(token){return 'images/'+token+'.jpg';}
function qrDataUrl(text){
  const qr=qrcode(0,'M');
  qr.addData(text);
  qr.make();
  return qr.createDataURL(6,8);
}
const params=new URLSearchParams(location.search), vtoken=params.get('v');
const app=document.getElementById('app');
if(vtoken && TOKEN_MAP[vtoken]){
  const pos=TOKEN_MAP[vtoken];
  document.body.innerHTML='<div class="participant"><img src="'+imgSrc(vtoken)+'" alt=""></div>';
} else {
let count=10, order=[], page=0;
app.innerHTML=`<header><h1>Mysterious Pictures Challenge</h1><button onclick="toggleFS()">Full Screen</button></header>
<audio id="challengeMusic" src="challenge-music.mp3" preload="auto"></audio>
<div class="wrap"><div class="panel"><div class="controls">
<label><b>Pictures:</b> <select id="count">${Array.from({length:29},(_,k)=>`<option value="${k+2}" ${k+2===10?'selected':''}>${k+2}</option>`).join('')}</select></label>
<button class="primary" onclick="start()">Start / Apply</button><button onclick="shuffle()">Shuffle</button>
<button onclick="toggleReveal()">Show Answer</button><button onclick="resetAll()">Reset</button>
</div><div class="status" id="status"></div><div class="note">Four QR codes per screen. Letters do not reveal picture order.</div></div>
<div class="venue-tools">
  <div class="toolbox">
    <div class="music-row"><button id="musicBtn" class="music-btn" onclick="toggleMusic()">▶ Play Music</button></div>
  </div>
  <div class="toolbox timer-box">
    <div id="timerDisplay" class="timer-display">05:00</div>
    <div class="timer-controls">
      <label><b>Minutes:</b> <input id="timerMinutes" type="number" min="1" max="180" value="5"></label>
      <button class="primary" id="timerStartBtn" onclick="toggleTimer()">Start Timer</button>
      <button onclick="resetTimer()">Reset Timer</button>
    </div>
  </div>
</div>
<div class="grid" id="grid"></div><div class="nav"><button id="prev" onclick="move(-1)">Previous</button><button id="next" onclick="move(1)">Next</button></div>
<div class="reveal panel" id="reveal"><h2 style="text-align:center;color:#54227d">Correct Zoom-Out Sequence</h2><div class="seq" id="seq"></div></div></div>`;
start();
function start(){count=+document.getElementById('count').value;order=Array.from({length:count},(_,i)=>i+1);shuffleArray(order);page=0;render();renderReveal();}
function shuffleArray(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
window.shuffle=function(){shuffleArray(order);page=0;render();}
window.move=function(d){page=Math.max(0,Math.min(Math.ceil(count/4)-1,page+d));render();}
function render(){let slice=order.slice(page*4,page*4+4);document.getElementById('grid').innerHTML=slice.map((posNum,j)=>{const tk=POS_TO_TOKEN[posNum-1];const url=BASE_URL+'?v='+tk;return `<div class="qcard"><img src="${qrDataUrl(url)}"><div class="letter">${String.fromCharCode(65+page*4+j)}</div></div>`}).join('');
let pages=Math.ceil(count/4);document.getElementById('status').textContent=`QR Screen ${page+1} of ${pages} • ${count} pictures selected`;
document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===pages-1;}
function renderReveal(){document.getElementById('seq').innerHTML=Array.from({length:count},(_,i)=>{const tk=POS_TO_TOKEN[i];return `<div><img src="${imgSrc(tk)}">Picture ${i+1}</div>`}).join('')}
window.toggleReveal=function(){document.getElementById('reveal').classList.toggle('show');document.getElementById('reveal').scrollIntoView({behavior:'smooth'})}
window.resetAll=function(){document.getElementById('count').value=10;document.getElementById('reveal').classList.remove('show');start()}
window.toggleFS=function(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}

let timerRemaining=300,timerRunning=false,timerInterval=null;
function formatTime(sec){sec=Math.max(0,Math.floor(sec));const m=Math.floor(sec/60),ss=sec%60;return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')}
function paintTimer(){const el=document.getElementById('timerDisplay');if(!el)return;el.textContent=formatTime(timerRemaining);el.classList.toggle('done',timerRemaining===0)}
window.toggleTimer=function(){
  const btn=document.getElementById('timerStartBtn');
  if(timerRunning){timerRunning=false;clearInterval(timerInterval);timerInterval=null;btn.textContent='Resume Timer';return}
  if(timerRemaining<=0){window.resetTimer()}
  timerRunning=true;btn.textContent='Pause Timer';
  timerInterval=setInterval(()=>{timerRemaining--;paintTimer();if(timerRemaining<=0){timerRemaining=0;paintTimer();timerRunning=false;clearInterval(timerInterval);timerInterval=null;btn.textContent='Start Timer'}},1000)
}
window.resetTimer=function(){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null}
  timerRunning=false;
  const input=document.getElementById('timerMinutes');
  const mins=Math.min(180,Math.max(1,parseInt(input?.value,10)||5));
  if(input)input.value=mins;
  timerRemaining=mins*60;paintTimer();
  const btn=document.getElementById('timerStartBtn');if(btn)btn.textContent='Start Timer';
}
document.getElementById('timerMinutes')?.addEventListener('change',()=>{if(!timerRunning)window.resetTimer()});

window.toggleMusic=function(){
  const audio=document.getElementById('challengeMusic'),btn=document.getElementById('musicBtn');
  if(!audio||!btn)return;
  if(audio.paused){audio.currentTime=0;audio.play().then(()=>{btn.textContent='■ Stop Music';btn.classList.add('playing')}).catch(()=>{})}
  else{audio.pause();audio.currentTime=0;btn.textContent='▶ Play Music';btn.classList.remove('playing')}
}
document.getElementById('challengeMusic')?.addEventListener('ended',()=>{const btn=document.getElementById('musicBtn');if(btn){btn.textContent='▶ Play Music';btn.classList.remove('playing')}})
paintTimer();
}
</script></body></html>
